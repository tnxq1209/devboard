# Build and Push
name: Build and Push

on:
    workflow_call:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                folder: [frontend, backend, ai-service]
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./${{ matrix.folder }}
                load: true
                push: false
                tags: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:sha-${{ github.sha }}
                  ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max
            - name: Scan Docker image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:sha-${{ github.sha }}
                format: table
                output: trivy-scan-results-${{ matrix.folder }}.txt
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            - name: Upload Trivy scan results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: trivy-scan-results-${{ matrix.folder }}
                path: trivy-scan-results-${{ matrix.folder }}.txt
                if-no-files-found: ignore
                retention-days: 7

            - name: Docker Hub login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Push verified Docker images
              env:
                IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}
                IMAGE_TAG: sha-${{ github.sha }}
              run: |
                set -euo pipefail

                docker push "${IMAGE}:${IMAGE_TAG}"
                docker push "${IMAGE}:latest"
