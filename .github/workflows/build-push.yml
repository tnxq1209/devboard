# Scan, Build and Push
name: Scan Build Push

on:
    workflow_call:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                folder: [frontend, backend, ai-service]
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Docker lint
              uses: hadolint/hadolint-action@v3.1.0 # Lint the Dockerfile for best practices and potential issues.
              with:
                  dockerfile: ./${{ matrix.folder }}/Dockerfile
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build
              uses: docker/build-push-action@v7
              with:
                context: ./${{ matrix.folder }}
                load: true
                push: false
                tags: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:sha-${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
            - name: Scan Docker image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:sha-${{ github.sha }}
                format: table
                output: trivy-scan-results-${{ matrix.folder }}.txt
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            - name: Upload Trivy scan results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: trivy-scan-results-${{ matrix.folder }}
                path: trivy-scan-results-${{ matrix.folder }}.txt
                if-no-files-found: ignore
                retention-days: 7

            - name: Docker Hub login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Push verified Docker image
              env:
                IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}
                IMAGE_TAG: sha-${{ github.sha }}
              run: |
                set -euo pipefail
                docker push "${IMAGE}:${IMAGE_TAG}"

            - name: Capture and save image digest
              env:
                IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}
                IMAGE_TAG: sha-${{ github.sha }}
              run: |
                set -euo pipefail

                digest="$(docker buildx imagetools inspect \
                  "${IMAGE}:${IMAGE_TAG}" \
                  --format '{{json .Manifest}}' |
                  python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"

                if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                  echo "::error::Invalid image digest: $digest"
                  exit 1
                fi

                printf '%s\n' "$digest" > "digest-${{ matrix.folder }}.txt"
                echo "Pushed image digest: $digest"

            - name: Upload image digest
              uses: actions/upload-artifact@v7
              with:
                name: image-digest-${{ matrix.folder }}
                path: digest-${{ matrix.folder }}.txt
                retention-days: 1
