# Dast scan
name: OWASP ZAP

on: 
    workflow_dispatch:
        inputs:
          NLB:
            description: 'The NLB endpoint to scan'
            required: true
            default: 'nlb-3-15-123-456.us-east-2.elb.amazonaws.com'

jobs:
    Scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
            - name: Wait for the services to be healthy
              run: |
                timeout 60s sh -c 'until curl -s http://${{ github.event.inputs.NLB }}:8080 > /dev/null; do sleep 2; done'
            - name: OWASP ZAP baseline scan
              uses: zaproxy/action-baseline@v0.14.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                target: 'http://${{ github.event.inputs.NLB }}:8080'
                fail_action: false
                allow_issue_writing: false
