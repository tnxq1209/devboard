# Code Quality Checks using SAST(Static Application Security Testing). We are running the linting and formatting checks for the frontend, backend, and AI service codebases.
# Lint catches structural bugs, syntax errors, and code smells.
# Formatting enforce uniform code aesthetics and readability.
name: Code Quality

on:
  workflow_call:

jobs:
    sast-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              working-directory: ./frontend
            - name: Run lint
              run: |
                npm run lint
              working-directory: ./frontend

    sast-backend:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: backend/go.mod
                  cache-dependency-path: backend/go.sum
            - name: Install dependencies
              run: go mod download
              working-directory: ./backend
            - name: Run go fmt
              run: go fmt ./...
              working-directory: ./backend  
            - name: Run Go Vet
              run: go vet ./...
              working-directory: ./backend
            - name: Running golangci-lint
              continue-on-error: true
              uses: golangci/golangci-lint-action@v9
              with:
                working-directory: backend
    sast-ai:
      runs-on: ubuntu-latest
      steps:
        - name: Code Checkout
          uses: actions/checkout@v7
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.14'

        - name: Run Ruff
          run: |
            cd ai-service
            pip install ruff
            ruff check .