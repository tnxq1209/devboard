# Dependency Scan to ensure that the project dependencies are up to date and free from known vulnerabilities.
name: Dependency Scan

on:
    workflow_call:

jobs:
    dependency-scan-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              working-directory: ./frontend
            - name: Run Dependency Scan
              run: |
                mkdir -p reports
                npm audit | tee reports/frontend-npm-audit.txt
              working-directory: ./frontend
              continue-on-error: false # Use "false" in production. Using "true" for testing purposes.
            - name: Upload Reports
              if: always() # Force a step or job to run regardless of the status of previous steps by using the if: always() conditional.
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report-frontend
                path: reports/
                retention-days: 5
              
            
    dependency-scan-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
          
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: '1.27.3'
                cache-dependency-path: ./backend/go.sum
            - name: Verify Go version
              run: |
                go version
                go env GOVERSION GOROOT
            - name: Install dependencies
              run: go mod download
              working-directory: ./backend
            - name: Installing govulncheck
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

            - name: Run Dependency Scan
              working-directory: ./backend
              run: |
                mkdir -p reports
                $(go env GOPATH)/bin/govulncheck ./... | tee reports/backend-govulncheck.txt
              continue-on-error: false
            - name: Upload Reports
              if: always() # Force a step or job to run regardless of the status of previous steps by using the if: always() conditional.
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report-backend
                path: reports/
                retention-days: 5



    dependency-scan-ai:
      runs-on: ubuntu-latest
      steps:
        - name: Code Checkout
          uses: actions/checkout@v7
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.14'

        - name: Run dependency scan
          working-directory: ai-service
          run: |
            mkdir -p ../reports
            pip install pip-audit
            pip-audit -r requirements.txt | tee ../reports/ai-pip-audit.txt

        - name: Upload Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: dependency-scan-report-ai-service
            path: reports/
            retention-days: 5
