# Ensure Docker images are scanned for vulnerabilities 
name: Docker Scan

on:
    workflow_call:

jobs:
    docker-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false #if one of the matrix jobs fails, the other jobs will continue to run
            matrix:
                dockerfile: [frontend,backend,ai-service]
        steps:
            - name: code checkout
              uses: actions/checkout@v7
            - name: Docker lint
              uses: hadolint/hadolint-action@v3.1.0 # Lint the Dockerfile for best practices and potential issues.
              with:
                  dockerfile: ./${{ matrix.dockerfile }}/Dockerfile
