
name: Update Manifests

on:
  workflow_call:

jobs:
  update-manifests:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update application image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          update_image_tag() {
            local file="$1"
            local image="$2"

            if ! grep -qE "${image}:(latest|sha-[[:alnum:]]+)" "$file"; then
              echo "::error::No matching image tag found for ${image} in ${file}"
              exit 1
            fi

            sed -i -E \
              "s|(${image}:)(latest|sha-[[:alnum:]]+)|\1${IMAGE_TAG}|g" \
              "$file"

            echo "Updated ${image} to ${IMAGE_TAG} in ${file}"
          }

          update_image_tag \
            k8s/on-cluster/ai-service-deployment.yml \
            tnxq1209/devboard-ai-service

          update_image_tag \
            k8s/on-cluster/backend-deployment.yml \
            tnxq1209/devboard-backend

          update_image_tag \
            k8s/on-cluster/frontend-deployment.yml \
            tnxq1209/devboard-frontend

      - name: Commit and push manifest changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/on-cluster/ai-service-deployment.yml \
            k8s/on-cluster/backend-deployment.yml \
            k8s/on-cluster/frontend-deployment.yml

          if git diff --cached --quiet; then
            echo "::error::No manifest changes detected; refusing to silently skip the update."
            exit 1
          fi

          git commit -m "ci: update images to ${IMAGE_TAG}"
          git push origin HEAD:master
