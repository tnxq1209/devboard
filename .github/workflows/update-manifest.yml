
name: Update Manifests

on:
  workflow_call:

jobs:
  update-manifests:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update application image tags
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          image_tag = os.environ["IMAGE_TAG"]

          images = {
              "k8s/on-cluster/ai-service-deployment.yml": "tnxq1209/devboard-ai-service",
              "k8s/on-cluster/backend-deployment.yml": "tnxq1209/devboard-backend",
              "k8s/on-cluster/frontend-deployment.yml": "tnxq1209/devboard-frontend",
          }

          for filename, image in images.items():
              path = Path(filename)
              content = path.read_text()

              pattern = re.escape(image) + r":(?:latest|sha-[A-Za-z0-9]+)"
              updated, count = re.subn(pattern, f"{image}:{image_tag}", content)

              if count == 0:
                  raise SystemExit(
                      f"ERROR: No matching image tag found for {image} in {filename}"
                  )

              path.write_text(updated)
              print(f"Updated {image} to {image_tag} in {filename}")
          PY

      - name: Commit and push manifest changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/on-cluster/ai-service-deployment.yml \
            k8s/on-cluster/backend-deployment.yml \
            k8s/on-cluster/frontend-deployment.yml

          if git diff --cached --quiet; then
            echo "::error::No manifest changes detected; refusing to silently skip the update."
            exit 1
          fi

          git commit -m "ci: update images to ${IMAGE_TAG}"
          git push origin HEAD:master
