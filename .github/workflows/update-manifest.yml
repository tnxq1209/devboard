name: Docker Scan

on:
    workflow_call:

jobs:
    update-manifests:
        name: Update Kubernetes Image Tags
        runs-on: ubuntu-latest
        permissions:
          contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                ref: master

            - name: Update application image tags
              env:
                IMAGE_TAG: sha-${{ github.sha }}
              run: |
                sed -i "s|tnxq1209/devboard-ai-service:latest|tnxq1209/devboard-ai-service:${IMAGE_TAG}|" \
                  k8s/on-cluster/ai-service-deployment.yml

                sed -i "s|tnxq1209/devboard-backend:latest|tnxq1209/devboard-backend:${IMAGE_TAG}|" \
                  k8s/on-cluster/backend-deployment.yml

                sed -i "s|tnxq1209/devboard-frontend:latest|tnxq1209/devboard-frontend:${IMAGE_TAG}|" \
                  k8s/on-cluster/frontend-deployment.yml

            - name: Commit and push manifest changes
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add \
                  k8s/on-cluster/ai-service-deployment.yml \
                  k8s/on-cluster/backend-deployment.yml \
                  k8s/on-cluster/frontend-deployment.yml

                if git diff --cached --quiet; then
                  echo "No manifest changes to commit."
                  exit 0
                fi

                git commit -m "ci: update images to sha-${GITHUB_SHA}"
                git push origin HEAD:master 