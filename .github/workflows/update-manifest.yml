
name: Update Manifests

on:
  workflow_call:

jobs:
  update-manifests:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest
    concurrency:
      group: devboard-manifest-update-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download frontend image digest
        uses: actions/download-artifact@v7
        with:
          name: image-digest-frontend
          path: image-digests/frontend

      - name: Download backend image digest
        uses: actions/download-artifact@v7
        with:
          name: image-digest-backend
          path: image-digests/backend

      - name: Download AI service image digest
        uses: actions/download-artifact@v7
        with:
          name: image-digest-ai-service
          path: image-digests/ai-service

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Verify signed images
        env:
          IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/devboard
          EXPECTED_WORKFLOW: https://github.com/tnxq1209/devboard/.github/workflows/build-push.yml@refs/heads/master
        run: |
          set -euo pipefail

          for service in frontend backend ai-service; do
            digest="$(cat "image-digests/${service}/digest-${service}.txt")"

            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid digest for ${service}: ${digest}"
              exit 1
            fi

            cosign verify \
              --certificate-identity "${EXPECTED_WORKFLOW}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE_PREFIX}-${service}@${digest}"
          done

      - name: Update application image digests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          images = {
              "k8s/on-cluster/ai-service-deployment.yml": (
                  "tnxq1209/devboard-ai-service",
                  "image-digests/ai-service/digest-ai-service.txt",
              ),
              "k8s/on-cluster/backend-deployment.yml": (
                  "tnxq1209/devboard-backend",
                  "image-digests/backend/digest-backend.txt",
              ),
              "k8s/on-cluster/frontend-deployment.yml": (
                  "tnxq1209/devboard-frontend",
                  "image-digests/frontend/digest-frontend.txt",
              ),
          }

          for filename, (image, digest_file) in images.items():
              digest = Path(digest_file).read_text().strip()

              if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
                  raise SystemExit(
                      f"ERROR: Invalid digest in {digest_file}: {digest!r}"
                  )

              path = Path(filename)
              content = path.read_text()

              pattern = re.escape(image) + r"(?::[A-Za-z0-9_.-]+|@sha256:[a-f0-9]{64})"
              updated, count = re.subn(
                  pattern,
                  f"{image}@{digest}",
                  content,
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one image reference for "
                      f"{image} in {filename}, found {count}"
                  )

              path.write_text(updated)
              print(f"Updated {filename} to {image}@{digest}")
          PY

      - name: Check whether this run is stale
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"

          if [[ "$SOURCE_SHA" != "$latest_sha" ]]; then
            echo "::error::This run is stale. Source commit $SOURCE_SHA is not the latest master commit $latest_sha."
            exit 1
          fi

          echo "Source commit is still the latest master commit."

      - name: Commit and push manifest changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/on-cluster/ai-service-deployment.yml \
            k8s/on-cluster/backend-deployment.yml \
            k8s/on-cluster/frontend-deployment.yml

          if git diff --cached --quiet; then
            echo "::error::No manifest changes detected; refusing to silently skip the update."
            exit 1
          fi

          git commit -m "ci: update images to ${IMAGE_TAG}"
          git push origin HEAD:master
