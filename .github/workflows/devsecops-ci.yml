# The DevSecOps workflows calling multiple security scans for the project.
# This workflow will run on every push and pull request to the main branch,
# and will scan the code for vulnerabilities using SonarQube, Dependency Scanning, Secret Scanning, and Docker Scanning.
name: Secure Workflow

concurrency:
  group: devboard-master-ci
  cancel-in-progress: false

on:
    push:
        branches:
            - master
        paths:
            - '.github/**'
            - 'backend/**'
            - 'frontend/**'
            - 'ai-service/**'
            - 'sonar-project.properties'

permissions:
  contents: write

jobs:

    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    code-quality:
        needs :
            - secret-scanning
        uses: ./.github/workflows/code-quality.yml

    dependency-scan:
        needs :
            - secret-scanning
        uses: ./.github/workflows/dependency-scan.yml

    code-test:
        needs :
            - secret-scanning
        uses: ./.github/workflows/code-test.yml

    sonar-scan:
        needs :
            - secret-scanning
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    build-and-push:
        needs: [code-quality,dependency-scan,code-test,sonar-scan]
        uses: ./.github/workflows/build-push.yml
        secrets: inherit
        permissions:
            contents: read
            id-token: write

    update-manifests:
        needs: [build-and-push]
        uses: ./.github/workflows/update-manifest.yml
        secrets: inherit
    post-deployment-verify:
        needs: [update-manifests]
        uses: ./.github/workflows/post-deployment-verify.yml
        permissions:
            contents: read
            id-token: write