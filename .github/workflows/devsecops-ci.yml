# The DevSecOps workflows calling multiple security scans for the project.
# This workflow will run on every push and pull request to the main branch,
# and will scan the code for vulnerabilities using SonarQube, Dependency Scanning, Secret Scanning, and Docker Scanning.
name: Secure Workflow

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows'
            - 'backend/**'
            - 'frontend/**'
            - 'ai-service/**'
            - 'sonar-project.properties'

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    dependency-scan:
        uses: ./.github/workflows/dependency-scan.yml

    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    docker-scan:
        uses: ./.github/workflows/docker-scan.yml
        secrets: inherit # This line is used to inherit the secrets from the parent workflow. It allows the child workflow to access the secrets defined in the parent workflow, which can be useful for passing sensitive information such as API keys or tokens to the child workflow without exposing them in the code.
    
    sonar-scan:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit
    
    code-test:
        uses: ./.github/workflows/code-test.yml

    build-and-push:
        needs: [code-quality,dependency-scan,secret-scanning,docker-scan,sonar-scan,code-test]
        uses: ./.github/workflows/build-push.yml
        secrets: inherit
    update-manifests:
        needs:
            - build-and-push
        uses: ./.github/workflows/update-manifest.yml
        secrets: inherit