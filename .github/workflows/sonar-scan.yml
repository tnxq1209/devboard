# security scan in line with the GitHub security best practices. This workflow will run on every push and pull request to the main branch, and will scan the code for vulnerabilities using SonarQube.
name: Sonar Scan

on:
    workflow_call:

permissions:
  contents: read
jobs:
    sonar-scan:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout   
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: Sonarqube Cloud Scan
              uses: SonarSource/sonarqube-scan-action@v8 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                args: >
                  -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
                  -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}