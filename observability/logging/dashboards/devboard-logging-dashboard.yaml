apiVersion: v1
kind: ConfigMap
metadata:
  name: devboard-logging-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devboard-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "All DevBoard logs",
          "description": "All container logs collected from the DevBoard namespace.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devboard\"}",
              "queryType": "range",
              "editorMode": "code",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Backend logs",
          "description": "Backend container logs.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devboard\", pod=~\".*backend.*\"}",
              "queryType": "range",
              "editorMode": "code",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        },
        {
          "id": 3,
          "type": "logs",
          "title": "AI service logs",
          "description": "AI service container logs.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devboard\", pod=~\".*(ai-service|ai).*\"}",
              "queryType": "range",
              "editorMode": "code",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Frontend logs",
          "description": "Frontend container logs.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devboard\", pod=~\".*frontend.*\"}",
              "queryType": "range",
              "editorMode": "code",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Potential errors",
          "description": "Searches common error terms in unstructured logs.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"devboard\"} |~ \"(?i)(error|fatal|panic|exception)\"",
              "queryType": "range",
              "editorMode": "code",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Log volume",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"devboard\"}[1m]))",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "DevBoard log lines/min",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Log volume by pod",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (count_over_time({namespace=\"devboard\"}[1m]))",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "devboard",
        "logging",
        "loki"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "DevBoard \u2014 Logs",
      "uid": "devboard-logs",
      "version": 1,
      "weekStart": ""
    }
