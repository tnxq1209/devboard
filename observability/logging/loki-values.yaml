# Grafana Community Loki chart 21.2.3
# Small single-node EKS deployment: monolithic Loki + gp3 persistence.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    allow_structured_metadata: true
    retention_period: 168h

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

# One Loki StatefulSet with persistent storage.
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Keep this deployment lightweight; no separate cache/gateway pods.
gateway:
  enabled: false
  
# Disable Helm test hooks because Loki Canary is disabled.
test:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Explicitly disable unused deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0




