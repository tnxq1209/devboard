# 1. PersistentVolume (PV) - Defines physical storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: devboard
  labels:
    app: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/postgres"
