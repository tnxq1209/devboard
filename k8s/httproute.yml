
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-route
  namespace: devboard
spec:
  parentRefs:
    - name: devboard-gateway-nlb
      sectionName: https
  hostnames:
    - devboard.site
    - www.devboard.site
  rules:
    # AI requests
    - matches:
        - path:
            type: PathPrefix
            value: /api/ai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - name: ai-service
          port: 3005

    # All other requests go to frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devboard-frontend-service
          port: 8080
