
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-http-redirect
  namespace: devboard
  annotations:
    external-dns.kubernetes.io/manage: "true"
spec:
  parentRefs:
    - name: devboard-gateway-nlb
      sectionName: http
    - name: devboard-gateway-nlb
      sectionName: http-www
  hostnames:
    - devboard.site
    - www.devboard.site
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
