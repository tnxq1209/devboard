apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devboard-backend
  namespace: devboard
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - devboard
  selector:
    matchLabels:
      app: devboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s