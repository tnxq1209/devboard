
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devboard-gateway-nlb
  namespace: devboard
spec:
  gatewayClassName: envoy

  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: devboard-proxy-config

  listeners:
    - name: http
      hostname: devboard.site
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      hostname: devboard.site
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: devboard-site-tls-prod
      allowedRoutes:
        namespaces:
          from: Same

    - name: http-www
      hostname: www.devboard.site
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https-www
      hostname: www.devboard.site
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: devboard-site-tls-prod
      allowedRoutes:
        namespaces:
          from: Same
