apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devboard-app-verifier
  namespace: devboard
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - devboard-frontend-deployment
      - devboard-backend-deployment
      - devboard-ai-service-deployment
    verbs:
      - get
