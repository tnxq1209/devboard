apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devboard-list
  namespace: argocd
spec:
  # The list generator lets you enumerate a static set of elements (apps).
  generators:
    - list:
        elements:
          - app: observability-metrics
            path: observability/metrics
          - app: observability-logging
            path: observability/logging
          - app: observability-tracing
            path: observability/tracing
  # Template that will be used to generate individual Application CRs
  template:
    metadata:
      # name template uses the element key 'app'
      name: '{{app}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/tnxq1209/devboard.git
        targetRevision: master
        path: '{{path}}'
        directory:
          recurse: true # recurse to each subdirectory
      destination:
        server: https://kubernetes.default.svc
        namespace: devboard
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
