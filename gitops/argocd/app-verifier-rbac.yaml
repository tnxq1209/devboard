apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-verifier-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tnxq1209/devboard.git
    targetRevision: master
    path: k8s/app-verifier-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
