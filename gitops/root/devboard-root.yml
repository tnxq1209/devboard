apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devboard-list
  namespace: argocd
spec:
  # The list generator lets you enumerate a static set of elements (apps).
  generators:
    - list:
        elements:
          - app: GatewayClass-controller
            path: gitops/gateway
          - app: devboard 
            path: gitops/devboard 
          - app: ollama
            path: gitops/ollama
          - app: RBAC-liveness-check
            path: gitops/app-verifier-rbac
  # Template that will be used to generate individual Application CRs
  template:
    metadata:
      # name template uses the element key 'app'
      name: '{{app}}-list'
    spec:
      project: default
      source:
        repoURL: https://github.com/tnxq1209/argocd-demos.git
        targetRevision: master
        path: '{{path}}'                # resolved from element
      destination:
        server: https://kubernetes.default.svc
        namespace: devboard
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
